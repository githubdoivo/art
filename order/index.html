<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order a piece · Ivo Lopes</title>
  <meta name="description" content="Order a handmade ceramic piece: send a photo of what you have in mind and get a quote by email.">
  <meta property="og:title" content="Order a piece · Ivo Lopes">
  <meta property="og:description" content="Send a photo of what you have in mind and get a quote by email.">
  <meta property="og:url" content="https://art.ivolopes.com/order/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://art.ivolopes.com/og-image.png?v=5">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://art.ivolopes.com/order/">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#f7e9d2">
  <meta name="color-scheme" content="only light">
  <meta name="darkreader-lock">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/book.css?v=11">
  <link rel="stylesheet" href="/order.css?v=2">
</head>
<body class="order-page">
  <!-- A page of the same sketchbook: the order form on a sheet taped in,
       beside a piece. Only a way back home and the language switch. -->
  <header class="order-top">
    <a class="back" id="back-link" href="/">Back</a>
    <button class="lang" id="lang-toggle" type="button">PT</button>
  </header>

  <main class="order-main">
    <div class="order-side">
      <div class="name-row">
        <h1 id="order-title">Order a piece</h1>
        <img class="seal" src="/book/seal.png" width="411" height="416" alt="">
      </div>
      <p class="order-intro" id="order-intro"></p>
      <figure class="order-piece">
        <img class="tape" src="/book/tape-sage.webp" alt="">
        <img class="piece" id="order-piece" src="/book/work-blue.webp" width="720" height="900" alt="">
      </figure>
      <p class="note" id="order-note"></p>
    </div>

    <div class="sheet-wrap">
      <div class="sheet">
        <div id="form-slot"></div>
        <p class="sheet-mail"><a class="mail" href="mailto:mail@ivolopes.com">mail@ivolopes.com</a></p>
      </div>
      <img class="tape t1" src="/book/tape-clay.webp" alt="">
      <img class="tape t2" src="/book/tape-sand.webp" alt="">
    </div>
  </main>

  <footer class="foot"><img src="/book/seal.png" alt="" width="28" height="28"><span id="footer"></span></footer>

  <script src="/content.js?v=6"></script>
  <script type="module" src="/order-page.js?v=2"></script>
</body>
</html>
