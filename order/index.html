      var t = localStorage.getItem("theme");

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body class="order-page">
  <header class="topbar">
    <a class="brand" href="/" id="home-link"><span class="brand-mark" aria-hidden="true"></span><span>Ivo Lopes</span></a>
    <div class="controls">
      <button class="icon-btn lang-btn" id="lang-toggle" type="button">PT</button>
