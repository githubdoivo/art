<!doctype html>
<!-- The link preview image (og-image.png), rendered by tools/build-og.mjs at
     1200x630 with the real clay at its last stage. Not linked from the site. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js" } }</script>
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #16120f; color: #efe7df; font-family: Inter, sans-serif; position: relative; }
  /* Kept towards the centre: some apps crop link previews to a square. */
  .text { position: absolute; left: 190px; top: 50%; transform: translateY(-50%); width: 520px; }
  .eyebrow { font: 600 20px Inter; letter-spacing: .16em; text-transform: uppercase; color: #e8956a; }
  h1 { font: 400 96px/1 Fraunces, serif; letter-spacing: -0.015em; margin-top: 18px; }
  .lead { font: italic 400 34px Fraunces, serif; color: #b3a497; margin-top: 18px; }
  .url { font: 500 22px Inter; color: #efe7df; margin-top: 44px; display: flex; align-items: center; gap: 12px; }
  .url::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: #e8956a; }
  canvas { position: absolute; left: 600px; top: 0; width: 460px; height: 630px; }
</style>
</head>
<body>
  <div class="text">
    <div class="eyebrow">Ceramics · Porto</div>
    <h1>Ivo Lopes</h1>
    <div class="lead">Earth, water, fire and time.</div>
    <div class="url">art.ivolopes.com</div>
  </div>
  <canvas id="clay"></canvas>
  <script type="module">
    import { createClay } from "../clay.js";
    const clay = createClay(document.getElementById("clay"), { reducedMotion: true, style: "toon" });
    clay.setStage(7);
    setTimeout(() => { document.body.dataset.ready = "1"; }, 1200);
  </script>
</body>
</html>
