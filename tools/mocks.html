<!doctype html>
<!-- Style comparison: one row of stages per style. tools/mocks.html?style=toon -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js" } }</script>
<style>
  * { margin: 0; box-sizing: border-box; }
  body { background: #f3ece4; color: #2a211b; font-family: Inter, sans-serif; padding: 28px 32px 24px; width: 1500px; }
  h1 { font: 400 40px Fraunces, serif; }
  h1 small { font: 600 13px Inter; letter-spacing: .14em; text-transform: uppercase; color: #9a4520; margin-left: 14px; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-top: 16px; }
  figure { background: #fbf7f2; border-radius: 16px; overflow: hidden; }
  canvas { width: 100%; height: 300px; display: block; }
  figcaption { font: 500 13px Inter; color: #6b5b4f; padding: 0 14px 12px; }
</style>
</head>
<body>
  <h1 id="title"></h1>
  <div class="row" id="row"></div>
  <script type="module">
    import { createClay, STYLES } from "../clay.js";
    const style = new URLSearchParams(location.search).get("style") || "realistic";
    const names = { realistic: "Realistic", toon: "Cel-shaded", ink: "Ink sketch", lowpoly: "Low-poly", pastel: "Soft pastel" };
    document.getElementById("title").innerHTML = `${names[style]}<small>style: ${style}</small>`;
    const stages = [[0, "lump"], [3, "opened"], [5, "shaped"], [5.55, "in the kiln"], [7, "glazed"]];
    const row = document.getElementById("row");
    for (const [s, label] of stages) {
      const fig = document.createElement("figure");
      fig.innerHTML = `<canvas></canvas><figcaption>${label}</figcaption>`;
      row.appendChild(fig);
      const clay = createClay(fig.querySelector("canvas"), { reducedMotion: true, style });
      clay.setStage(s);
    }
    setTimeout(() => (document.body.dataset.ready = "1"), 1500);
  </script>
</body>
</html>
