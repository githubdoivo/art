<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ivo Lopes · Ceramics</title>
  <meta name="description" content="Ceramics by Ivo Lopes, made by hand in Porto: vases, dishes and figures, and how they are made.">
  <meta property="og:title" content="Ivo Lopes · Ceramics">
  <meta property="og:description" content="Objects for a slower life. Handmade ceramics from Porto.">
  <meta property="og:url" content="https://art.ivolopes.com">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://art.ivolopes.com/og-image.png?v=5">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://art.ivolopes.com">
  <link rel="alternate" hreflang="en" href="https://art.ivolopes.com/?lang=en">
  <link rel="alternate" hreflang="pt" href="https://art.ivolopes.com/?lang=pt">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#f7e9d2">
  <!-- Paper is paper: one fixed look, and dark-mode extensions leave it alone. -->
  <meta name="color-scheme" content="only light">
  <meta name="darkreader-lock">
  <link rel="preload" as="image" href="book/header.webp" media="(min-width: 760px)">
  <link rel="preload" as="image" href="book/header-900.webp" media="(max-width: 759px)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="book.css?v=11">
</head>
<body>
  <a class="skip" href="#making">Skip to content</a>

  <!-- Header: a watercolour of the gourd on a table; the stamp and title sit on the bare paper beside it -->
  <header class="banner" id="top">
    <div class="banner-text">
      <div class="name-row">
        <h1 id="kind">Ceramics</h1>
        <img class="seal" id="seal" src="book/seal.png" width="411" height="416" alt="Red stone seal: ivo and a lotus">
      </div>
      <p class="tagline" id="tagline"></p>
    </div>
    <div class="nav">
      <button class="lang" id="lang-toggle" type="button">PT</button>
    </div>
  </header>

  <main>
    <section class="making" id="making" aria-labelledby="making-title">
      <!-- The making: a sticky scene. Scrolling drops each drawing onto the pile
           and tells that step; without motion it is a plain list. -->
      <div class="story" id="story">
        <div class="stage">
          <h2 id="making-title"></h2>
          <ol class="steps" id="steps"></ol>
          <div class="telling">
            <ol class="lines" id="lines"></ol>
            <p class="hint" id="hint" aria-hidden="true"></p>
          </div>
        </div>
      </div>
    </section>

    <section class="work" id="work" aria-labelledby="work-title">
      <h2 id="work-title"></h2>
      <p class="note" id="work-note"></p>
      <ul class="prints" id="prints"></ul>
    </section>

    <section class="porto" id="porto" aria-labelledby="porto-title">
      <h2 id="porto-title"></h2>
      <p class="note" id="porto-line"></p>
      <img class="porto-art" id="porto-art" src="book/porto.webp" width="1600" height="507" alt="" loading="lazy">
    </section>

    <section class="order" id="order" aria-labelledby="order-title">
      <h2 id="order-title"></h2>
      <p id="order-text"></p>
      <a class="btn" id="order-cta" href="/order/"></a>
      <p><a class="mail" href="mailto:mail@ivolopes.com">mail@ivolopes.com</a></p>
    </section>
  </main>

  <footer class="foot"><img src="book/seal.png" alt="" width="28" height="28"><span id="footer"></span></footer>

  <script src="content.js?v=7"></script>
  <script src="book.js?v=6"></script>
</body>
</html>
